<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créateur de Scénario Marketing 3D — Journal GenIA-L</title>

    <!-- Méta-description SEO -->
    <meta name="description" content="Générez la fiche scénario complète et les prompts de vos vidéos marketing 3D pour l'application Journal GenIA-L.">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FAF8F5; }
        .blob-amber { position: absolute; top: 0%; left: 10%; width: 650px; height: 650px; background: rgba(251, 191, 36, 0.20); filter: blur(140px); border-radius: 50%; z-index: 0; }
        .blob-indigo { position: absolute; top: 30%; right: 0%; width: 700px; height: 700px; background: rgba(99, 102, 241, 0.15); filter: blur(150px); border-radius: 50%; z-index: 0; }
        .blob-rose { position: absolute; top: 65%; left: -5%; width: 600px; height: 600px; background: rgba(244, 63, 94, 0.12); filter: blur(140px); border-radius: 50%; z-index: 0; }
    </style>
</head>
<body class="text-slate-900 antialiased relative overflow-x-hidden min-h-screen flex flex-col justify-between">

<div class="blob-amber"></div>
<div class="blob-indigo"></div>
<div class="blob-rose"></div>

<!-- HEADER INTÉGRANT LE LOGO ET LE TITRE -->
<header class="relative z-20 bg-indigo-950 text-white py-3 px-6 shadow-md">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="bg-white px-2.5 py-1.5 rounded-xl shadow-sm flex items-center">
                <img src="img/brand.png" alt="Journal GenIA-L" class="h-7 object-contain">
            </div>
            <span class="text-xs sm:text-sm font-extrabold tracking-tight text-white">Générateur de Fiche Scénario 3D</span>
        </div>
        <div class="text-xs font-bold text-amber-400 bg-indigo-900/80 px-3 py-1 rounded-full border border-indigo-700">
            Outil Interne / Marketing
        </div>
    </div>
</header>

<!-- CONTENU PRINCIPAL : FORMULAIRE DE PARAMÉTRAGE -->
<main class="relative z-10 max-w-4xl mx-auto px-6 py-12 flex-grow w-full">
    <div class="text-center max-w-2xl mx-auto mb-10">
        <span class="bg-indigo-100 text-indigo-900 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">Paramétrage du Clip</span>
        <h1 class="text-3xl sm:text-4xl font-black text-slate-900 mt-3 mb-2">Définissez vos variables de scénario</h1>
        <p class="text-slate-600 text-sm">Renseignez les champs ci-dessous pour afficher la fiche HTML complète et générer les prompts via l'API.</p>
    </div>

    <div class="bg-white p-8 sm:p-10 rounded-3xl border border-slate-200 shadow-xl">
        <form id="scenarioForm" onsubmit="event.preventDefault(); showScenarioSheet();">
            <div class="space-y-6">

                <div class="grid sm:grid-cols-2 gap-6 items-end">
                    <div>
                        <label class="block font-bold text-xs text-indigo-950 uppercase tracking-wider mb-2">Action rapide :</label>
                        <button type="button" onclick="clearForm()" class="w-full p-3 bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 rounded-xl font-bold text-sm transition flex items-center justify-center gap-2">
                            <span>🗑️</span> Vider le formulaire
                        </button>
                    </div>
                    <div>
                        <label class="block font-bold text-xs text-indigo-950 uppercase tracking-wider mb-2">Nom du Scénario :</label>
                        <input type="text" name="nom" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 font-semibold text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" value="La panique du dimanche soir">
                    </div>
                </div>

                <div>
                    <label class="block font-bold text-xs text-indigo-950 uppercase tracking-wider mb-2">1. Décor & Contexte (Lieu, ambiance) :</label>
                    <textarea name="decor" rows="2" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">Le salon cosy enseveli sous des piles de cahiers</textarea>
                </div>

                <div>
                    <label class="block font-bold text-xs text-indigo-950 uppercase tracking-wider mb-2">2. Action initiale :</label>
                    <textarea name="action" rows="2" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">Laura se tient au milieu du salon et attrape son smartphone.</textarea>
                </div>

                <div>
                    <label class="block font-bold text-xs text-indigo-950 uppercase tracking-wider mb-2">3. Problème / Pensée initiale (Voix off) :</label>
                    <textarea name="probleme" rows="2" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">"Je n'arriverai jamais à tout boucler pour demain matin !"</textarea>
                </div>

                <div>
                    <label class="block font-bold text-xs text-indigo-950 uppercase tracking-wider mb-2">4. Texte de la Dictée (de dos) :</label>
                    <textarea name="dictee" rows="2" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">"Génère-moi une préparation de type éveil avec différenciation."</textarea>
                </div>

                <div>
                    <label class="block font-bold text-xs text-indigo-950 uppercase tracking-wider mb-2">5. Réplique Finale (en partant) :</label>
                    <textarea name="replique" rows="2" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">"Terminé en un éclair... Et maintenant, c'est le grand bal !"</textarea>
                </div>

                <div>
                    <label class="block font-bold text-xs text-indigo-950 uppercase tracking-wider mb-2">6. Slogan Final en "-al" :</label>
                    <input type="text" name="slogan" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 font-semibold text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" value="Et tout devient idéal avec Journal GenIA-L !">
                </div>

            </div>

            <div class="text-center mt-8">
                <button type="submit" id="submitBtn" class="inline-flex items-center justify-center gap-2 bg-amber-400 hover:bg-amber-300 text-indigo-950 font-extrabold px-8 py-4 rounded-2xl shadow-lg transition transform hover:scale-[1.02]">
                    <span>📄</span> Voir la fiche scénario
                </button>
            </div>
        </form>
    </div>
</main>

<!-- FOOTER -->
<footer class="relative z-10 border-t border-slate-200 bg-white py-6 text-center text-xs text-slate-500 mt-12">
    <div class="max-w-7xl mx-auto px-6 flex flex-col sm:flex-row items-center justify-between gap-4">
        <div class="flex items-center gap-2">
            <div class="bg-white px-2 py-1 rounded shadow-sm border border-slate-100 flex items-center">
                <img src="img/brand.png" alt="Logo" class="h-5 object-contain">
            </div>
        </div>
        <p>© 2026 Journal GenIA-L — Outil de génération de fiches scénarios 3D.</p>
    </div>
</footer>

<script>
    function clearForm() {
        document.querySelector('[name="nom"]').value = '';
        document.querySelector('[name="decor"]').value = '';
        document.querySelector('[name="action"]').value = '';
        document.querySelector('[name="probleme"]').value = '';
        document.querySelector('[name="dictee"]').value = '';
        document.querySelector('[name="replique"]').value = '';
        document.querySelector('[name="slogan"]').value = '';
    }

    let currentScenarioData = {};
    let lastGeneratedSheetHtml = '';

    function showScenarioSheet() {
        currentScenarioData = {
            nom: document.querySelector('[name="nom"]').value,
            decor: document.querySelector('[name="decor"]').value,
            action: document.querySelector('[name="action"]').value,
            probleme: document.querySelector('[name="probleme"]').value,
            dictee: document.querySelector('[name="dictee"]').value,
            replique: document.querySelector('[name="replique"]').value,
            slogan: document.querySelector('[name="slogan"]').value
        };

        lastGeneratedSheetHtml = `
            <!DOCTYPE html>
            <html lang="fr">
            <head>
                <meta charset="UTF-8">
                <title>${currentScenarioData.nom || 'Fiche Scénario Marketing 3D'}</title>
                <style>
                    @page { size: A4 portrait; margin: 10mm; }
                    body {
                        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                        color: #2D3748; background-color: #FFFFFF; margin: 0; padding: 20px;
                    }
                    .page { width: 100%; max-width: 190mm; margin: 0 auto; background: white; box-sizing: border-box; }
                    .page-break { page-break-before: always; break-before: page; margin-top: 40px; }
                    h1.title {
                        font-size: 18pt; color: #1A365D; margin-top: 2mm; margin-bottom: 12px; font-weight: 700;
                        border-bottom: 3px solid #2B6CB0; padding-bottom: 8px; text-transform: uppercase; text-align: center;
                    }
                    .params-table {
                        width: 100%; border-collapse: collapse; background-color: #F7FAFC; border-radius: 8px; overflow: hidden; border: 2px solid #CBD5E0;
                    }
                    .params-table td {
                        padding: 10px 14px; border-bottom: 1px solid #E2E8F0; font-size: 10.5pt; vertical-align: top;
                    }
                    .params-table tr:last-child td { border-bottom: none; }
                    .params-label { font-weight: 600; color: #2C3E50; width: 38%; padding-top: 10px; }
                    .params-value { color: #1A365D; font-weight: 600; width: 62%; }
                    .page-page2 { font-size: 9pt; line-height: 1.35; }
                    .page-page2 .section-title {
                        font-size: 10.5pt; color: #FFFFFF; background-color: #2B6CB0; padding: 5px 10px; margin-top: 10px; margin-bottom: 5px; font-weight: 600; border-radius: 4px;
                    }
                    .page-page2 .sub-section {
                        background-color: #F7FAFC; border: 1px solid #E2E8F0; border-radius: 6px; padding: 8px 10px; margin-bottom: 8px;
                    }
                    .page-page2 .sub-section h3 { font-size: 9.5pt; color: #2C3E50; margin-top: 0; margin-bottom: 4px; }
                    .page-page2 ul { margin: 0; padding-left: 16px; }
                    .page-page2 li { margin-bottom: 3px; }
                    .page-page2 .baseline-box {
                        background-color: #FFF9C4; border-left: 4px solid #FBC02D; padding: 8px 10px; margin-top: 10px; border-radius: 4px; font-size: 8.5pt;
                    }
                    .page-page2 .baseline-box h4 { margin-top: 0; color: #B7791F; margin-bottom: 4px; font-size: 9pt; }
                    .page-page2 .baseline-box ul { padding-left: 14px; }
                    .page-page2 .baseline-box li { margin-bottom: 2px; }
                    .variable-ref { color: #2B6CB0; font-weight: 600; background-color: #EBF8FF; padding: 1px 3px; border-radius: 3px; }
                    .nav-bar { text-align: center; margin-bottom: 20px; display: flex; justify-content: center; gap: 10px; }
                    .nav-btn { background-color: #4A5568; color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 10pt; display: inline-block; border: none; cursor: pointer; }
                    .nav-btn:hover { background-color: #2D3748; }
                    .ai-btn { background-color: #D69E2E; color: #1A365D; }
                    .ai-btn:hover { background-color: #B7791F; }
                    .mail-btn { background-color: #3182CE; color: white; }
                    .mail-btn:hover { background-color: #2B6CB0; }
                    .ai-action-container { text-align: center; margin-top: 30px; margin-bottom: 20px; padding: 20px; background: #EBF8FF; border-radius: 8px; border: 1px dashed #3182CE; display: flex; flex-direction: column; align-items: center; gap: 10px; }
                    .btn-group { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
                </style>
            </head>
            <body>
                <div class="nav-bar">
                    <a href="javascript:window.location.reload();" class="nav-btn">⬅️ Retour au formulaire</a>
                </div>

                <!-- PAGE 1 : PARAMÈTRES -->
                <div class="page">
                    <h1 class="title">Fiche Scénario Marketing 3D<br><span style="font-size: 12pt; color: #4A5568;">Journal GenIA-L</span></h1>
                    <table class="params-table">
                        <tbody>
                            <tr><td class="params-label">Nom du Scénario</td><td class="params-value">${currentScenarioData.nom}</td></tr>
                            <tr><td class="params-label">1. Décor & Contexte (Lieu, ambiance)</td><td class="params-value">${currentScenarioData.decor}</td></tr>
                            <tr><td class="params-label">2. Action initiale</td><td class="params-value">${currentScenarioData.action}</td></tr>
                            <tr><td class="params-label">3. Problème / Pensée initiale (Voix off)</td><td class="params-value">${currentScenarioData.probleme}</td></tr>
                            <tr><td class="params-label">4. Texte de la Dictée (de dos)</td><td class="params-value">${currentScenarioData.dictee}</td></tr>
                            <tr><td class="params-label">5. Réplique Finale (en partant)</td><td class="params-value">${currentScenarioData.replique}</td></tr>
                            <tr><td class="params-label">6. Slogan Final en "-al"</td><td class="params-value">${currentScenarioData.slogan}</td></tr>
                        </tbody>
                    </table>
                </div>

                <!-- PAGE 2 : TRAME NARRATIVE ET TECHNIQUE -->
                <div class="page page-break page-page2">
                    <div class="section-title">PLAN 1 (0s à ~11s) : La Contrainte, l'Éclair et le Déclic Magique de Face</div>
                    <div class="sub-section">
                        <h3>Déroulement visuel et narratif détaillé :</h3>
                        <ul>
                            <li><b>Mise en place du décor :</b> L'action se déroule dans le lieu défini par le paramètre <span class="variable-ref">[1. Décor & Contexte : ${currentScenarioData.decor}]</span>.</li>
                            <li><b>Situation initiale (De face) :</b> Laura exécute <span class="variable-ref">[2. Action initiale : ${currentScenarioData.action}]</span>. Sa tension émotionnelle est transmise par ses expressions et le <span class="variable-ref">[3. Problème : ${currentScenarioData.probleme}]</span> en voix off (bouche fermée/neutre).</li>
                            <li><b>Prise en main du GSM :</b> Elle attrape son smartphone au milieu de cette action pour chercher de l'aide.</li>
                            <li><b>L'Éclair d'inspiration (De face) :</b> Au moment où elle regarde l'écran, un <b>éclair lumineux magique frappe le GSM</b>.</li>
                            <li><b>Transformation instantanée :</b> Son visage s'illumine instantanément ; elle bascule vers une joie enjouée et confiante.</li>
                            <li><b>Le Tournant de dos (Le Rituel) :</b> Dans cet élan, elle <b>effectue un pivot fluide et se tourne entièrement de dos</b> face à la caméra.</li>
                            <li><b>L'action éclair (1 seconde) :</b> Toujours positionnée de dos, elle dicte vocalement <span class="variable-ref">[4. Dictée : ${currentScenarioData.dictee}]</span> pendant 1 seconde tout en effectuant deux clics nets sur son écran.</li>
                            <li><b>Le Retour de face :</b> Elle se retourne immédiatement de face, pleine de peps.</li>
                        </ul>
                        <p style="margin-top: 4px; margin-bottom: 0px; color: #4A5568;"><b>Audio :</b> Voix off de tension ➔ Jingle d'éclair magique ➔ Bascule sur la musique orchestrale épique.</p>
                    </div>

                    <div class="section-title">PLAN 2 (~11s à ~22s) : La Délivrance et le Départ en Trombe</div>
                    <div class="sub-section">
                        <h3>Déroulement visuel et narratif détaillé :</h3>
                        <ul>
                            <li><b>De retour face caméra :</b> Laura apparaît totalement libérée et rayonnante grâce à l'application.</li>
                            <li><b>L'action multitâches fluide :</b> Elle finalise ses affaires d'un geste assuré et dynamique.</li>
                            <li><b>La Sortie triomphante :</b> Elle s'élance d'un pas décidé vers la sortie, tout en prononçant face caméra la réplique <span class="variable-ref">[5. Réplique : ${currentScenarioData.replique}]</span>.</li>
                        </ul>
                        <p style="margin-top: 4px; margin-bottom: 0px; color: #4A5568;"><b>Audio :</b> Continuation de la musique orchestrale épique + Voix de Laura enjouée en marchant.</p>
                    </div>

                    <div class="section-title">OUTRO / PACKSHOT FINAL (~22s à ~26s) : La Signature de Marque</div>
                    <div class="sub-section">
                        <h3>Déroulement visuel et narratif :</h3>
                        <ul style="margin-bottom: 0;">
                            <li><b>Visuel :</b> Transition franche vers l'écran de fin graphique aux couleurs de la marque avec l'apparition animée du logo.</li>
                            <li><b>Audio Fixe :</b> Voix off de fin percutante assénant le slogan <span class="variable-ref">[6. Slogan : ${currentScenarioData.slogan}]</span>.</li>
                        </ul>
                    </div>

                    <div class="baseline-box">
                        <h4>BASELINE TECHNIQUE OBLIGATOIRE (À inclure systématiquement pour guider l'IA) :</h4>
                        <ul>
                            <li><b>Personnage (Persistance de Laura) :</b> 3D animated character of Laura, messy updo bun, expressive green-blue eyes, freckles, wearing a beige knit cardigan over her outfit. Pixar style, consistent facial features and proportions across all video clips.</li>
                            <li><b>Styles de Prompts Vidéo (Kling AI) :</b> High quality 3D character animation, smooth fluid movement, cinematic lighting, 8k resolution, detailed micro-expressions.</li>
                            <li><b>Effets Sonores et Pistes Audio Fixes :</b> Jingle d'éclair magique à l'impact sur le GSM, déclenchement brutal d'une musique orchestrale épique de super-héros, double effet sonore de clic, jingle final de marque.</li>
                        </ul>
                    </div>

                    <!-- BOUTONS EN BAS DE LA FICHE -->
                    <div class="ai-action-container">
                        <h3 style="margin-top:0; color:#2B6CB0; font-size:11pt;">Options de production pour ce scénario</h3>
                        <p style="font-size:9.5pt; color:#4A5568; margin-bottom:15px;">Générez les prompts directement ou préparez un e-mail pour l'équipe support / marketing.</p>
                        <div class="btn-group">
                            <button type="button" id="apiBtn" class="nav-btn ai-btn" onclick="generateAiPrompts()">✨ Générer les prompts IA</button>
                            <button type="button" class="nav-btn mail-btn" onclick="sendScenarioEmail()">📧 Préparer un e-mail</button>
                        </div>
                    </div>
                </div>
            </body>
            </html>
        `;

        document.open();
        document.write(lastGeneratedSheetHtml);
        document.close();
    }

    function sendScenarioEmail() {
        navigator.clipboard.writeText(lastGeneratedSheetHtml).then(() => {
            alert("📋 Fiche scénario copiée dans le presse-papier !\n\nFaites un simple Ctrl+V (ou Cmd+V) dans le corps du message pour y coller la fiche complète.");
            const subject = encodeURIComponent("[Marketing Scénario] " + (currentScenarioData.nom || 'Sans nom'));
            const body = encodeURIComponent("Bonjour l'équipe,\n\nVoici la fiche scénario marketing 3D (le code HTML est prêt à être collé ci-dessous avec Ctrl+V) :\n\n[COLLEZ LE CODE HTML ICI]");
            window.location.href = `mailto:support@journalgenial.be?subject=${subject}&body=${body}`;
        }).catch(err => {
            const subject = encodeURIComponent("[Marketing Scénario] " + (currentScenarioData.nom || 'Sans nom'));
            const body = encodeURIComponent("Bonjour l'équipe,\n\nVoici le contenu de la fiche :\n" + lastGeneratedSheetHtml);
            window.location.href = `mailto:support@journalgenial.be?subject=${subject}&body=${body}`;
        });
    }

    function generateAiPrompts() {
        const btn = document.getElementById('apiBtn');
        btn.disabled = true;
        btn.innerText = "⏳ Génération des prompts en cours...";

        const generatedHtmlPayload = `
            <!DOCTYPE html>
            <html lang="fr">
            <head><meta charset="UTF-8"><title>${currentScenarioData.nom}</title></head>
            <body>
                <table>
                    <tbody>
                        <tr><td>Nom du Scénario :</td><td>${currentScenarioData.nom}</td></tr>
                        <tr><td>1. Décor & Contexte :</td><td>${currentScenarioData.decor}</td></tr>
                        <tr><td>2. Action initiale :</td><td>${currentScenarioData.action}</td></tr>
                        <tr><td>3. Problème / Pensée initiale :</td><td>${currentScenarioData.probleme}</td></tr>
                        <tr><td>4. Texte de la Dictée :</td><td>${currentScenarioData.dictee}</td></tr>
                        <tr><td>5. Réplique Finale :</td><td>${currentScenarioData.replique}</td></tr>
                        <tr><td>6. Slogan Final en "-al" :</td><td>${currentScenarioData.slogan}</td></tr>
                    </tbody>
                </table>
            </body>
            </html>
        `;

        fetch('https://api.journalgenial.be/generatescenario', {
            method: 'POST',
            headers: { 'Content-Type': 'text/html; charset=utf-8' },
            body: generatedHtmlPayload
        })
        .then(response => {
            if (!response.ok) throw new Error("Erreur réseau sur l'API /generatescenario (Statut " + response.status + ")");
            return response.text();
        })
        .then(htmlResult => {
            document.open();
            document.write(htmlResult);
            document.close();
        })
        .catch(error => {
            alert("Erreur lors de la génération : " + error.message);
            btn.disabled = false;
            btn.innerText = "✨ Générer les prompts IA";
        });
    }
</script>

</body>
</html>
