<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journal GenIA-L - Journal Généré par IA</title>
    <!-- Tailwind CSS pour un design propre et rapide -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- En-tête / Hero Section -->
    <main class="flex-grow flex items-center justify-center px-4 py-16">
        <div class="max-w-xl w-full text-center bg-white p-8 sm:p-12 rounded-2xl shadow-sm border border-slate-200">
            
            <!-- Badge ou Logo minimaliste -->
            <span class="inline-block bg-indigo-50 text-indigo-700 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider mb-6">
                Bientôt disponible
            </span>

            <!-- Nom marketing exact -->
            <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-slate-900 mb-3">
                Journal GenIA-L
            </h1>

            <!-- Sous-titre -->
            <p class="text-lg font-medium text-indigo-600 mb-6">
                Journal Généré par IA
            </p>

            <!-- Texte descriptif court -->
            <p class="text-slate-600 text-sm sm:text-base mb-8 leading-relaxed">
                Simplifiez la gestion et l'écriture de vos préparations et de votre journal de classe grâce à la puissance de l'intelligence artificielle.
            </p>

            <!-- Boutons d'action (Liens Google Play & Support) -->
            <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
                <a href="#" class="w-full sm:w-auto inline-flex items-center justify-center bg-slate-900 text-white hover:bg-slate-800 text-sm font-semibold px-5 py-3 rounded-xl transition shadow-sm">
                    Télécharger sur Google Play
                </a>
                <a href="mailto:support@journalgenial.be" class="w-full sm:w-auto inline-flex items-center justify-center bg-white text-slate-700 border border-slate-300 hover:bg-slate-50 text-sm font-semibold px-5 py-3 rounded-xl transition">
                    Contactez le Support
                </a>
            </div>
            
        </div>
    </main>

    <!-- Pied de page -->
    <footer class="py-6 text-center text-xs text-slate-400">
        &copy; 2026 Journal GenIA-L. Tous droits réservés.
    </footer>

</body>
</html>
